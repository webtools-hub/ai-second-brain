<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Second Brain</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 md:p-8 flex justify-center">

  <div class="w-full max-w-2xl flex flex-col gap-5">
    
    <!-- Header -->
    <div class="text-center space-y-1">
      <h1 class="text-2xl font-bold flex items-center justify-center gap-2">
        🧠 AI Second Brain
      </h1>
      <p class="text-xs text-slate-400">Grounded project research, gap analysis, and action plans</p>
    </div>

    <!-- API Key Settings -->
    <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl space-y-2">
      <label class="text-xs font-semibold text-slate-300">Gemini API Key</label>
      <div class="flex gap-2">
        <input
          id="apiKeyInput"
          type="password"
          placeholder="Paste your Gemini API key here..."
          class="flex-1 bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-blue-500"
        />
        <button
          onclick="saveApiKey()"
          class="bg-blue-600 hover:bg-blue-500 text-white font-medium px-4 py-2 rounded-lg text-sm transition-all"
        >
          Save Key
        </button>
      </div>
      <p id="keyStatus" class="text-[11px] text-slate-500">Key is stored locally in your browser only.</p>
    </div>

    <!-- Project Name -->
    <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl space-y-2">
      <label class="text-xs font-semibold text-slate-300">Project Name</label>
      <input
        id="projectName"
        type="text"
        value="AI Startup Research"
        class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-blue-500"
      />
    </div>

    <!-- Notes Input & Action Buttons -->
    <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl space-y-3">
      <label class="text-xs font-semibold text-slate-300">Project Documents & Knowledge Base</label>
      <textarea
        id="projectText"
        rows="6"
        placeholder="Paste raw research notes, competitor details, meeting summaries, or document text..."
        class="w-full bg-slate-950 border border-slate-700 rounded-lg p-3 text-sm text-slate-100 font-mono focus:outline-none focus:border-blue-500 resize-y"
      ></textarea>

      <div class="flex flex-col gap-2 pt-1">
        <span class="text-xs font-semibold text-slate-400">Instant AI Actions</span>
        <button
          onclick="runAction('summary')"
          class="w-full py-2.5 px-4 rounded-lg text-sm font-medium border border-blue-600/50 bg-blue-950/40 hover:bg-blue-900/50 text-blue-300 transition-all flex items-center justify-center gap-2"
        >
          🧠 Summarize Project
        </button>
        <button
          onclick="runAction('gaps')"
          class="w-full py-2.5 px-4 rounded-lg text-sm font-medium border border-amber-600/50 bg-amber-950/40 hover:bg-amber-900/50 text-amber-300 transition-all flex items-center justify-center gap-2"
        >
          🔍 Find Knowledge Gaps
        </button>
        <button
          onclick="runAction('action_plan')"
          class="w-full py-2.5 px-4 rounded-lg text-sm font-medium border border-emerald-600/50 bg-emerald-950/40 hover:bg-emerald-900/50 text-emerald-300 transition-all flex items-center justify-center gap-2"
        >
          🎯 Next Action Plan
        </button>
      </div>
    </div>

    <!-- Q&A Box -->
    <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl space-y-2">
      <label class="text-xs font-semibold text-slate-300">Ask Your Knowledge Base</label>
      <div class="flex gap-2">
        <input
          id="customQuestion"
          type="text"
          placeholder="e.g. What pricing details are mentioned?"
          class="flex-1 bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-green-500"
        />
        <button
          onclick="runAction('custom')"
          class="bg-emerald-600 hover:bg-emerald-500 text-white font-medium px-4 py-2 rounded-lg text-sm transition-all"
        >
          Ask
        </button>
      </div>
    </div>

    <!-- Output Section -->
    <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl space-y-3">
      <div class="flex justify-between items-center">
        <span class="text-xs font-semibold text-blue-400">Grounded Analysis Output</span>
        <button
          onclick="copyOutput()"
          class="text-xs bg-slate-800 hover:bg-slate-700 px-2.5 py-1 rounded text-slate-300 border border-slate-700"
        >
          📋 Copy
        </button>
      </div>

      <div id="loadingIndicator" class="hidden text-sm text-blue-400 py-3 animate-pulse">
        ⚡ Analyzing with Gemini...
      </div>

      <div id="errorMessage" class="hidden text-xs text-amber-400 bg-amber-950/50 border border-amber-900/50 p-3 rounded-lg"></div>

      <div
        id="outputContent"
        class="bg-slate-950 p-4 rounded-lg text-sm text-slate-200 whitespace-pre-wrap font-sans border border-slate-800 leading-relaxed min-h-[100px]"
      >Your output will appear here...</div>
    </div>

  </div>

  <script>
    window.onload = () => {
      const savedKey = localStorage.getItem('gemini_api_key');
      if (savedKey) {
        document.getElementById('apiKeyInput').value = savedKey;
        document.getElementById('keyStatus').textContent = '✅ Key loaded from browser storage.';
        document.getElementById('keyStatus').className = 'text-[11px] text-emerald-400';
      }
    };

    function saveApiKey() {
      const key = document.getElementById('apiKeyInput').value.trim();
      if (!key) {
        alert('Please enter a valid Gemini API key.');
        return;
      }
      localStorage.setItem('gemini_api_key', key);
      document.getElementById('keyStatus').textContent = '✅ Key saved successfully!';
      document.getElementById('keyStatus').className = 'text-[11px] text-emerald-400';
      alert('API Key saved!');
    }

    async function runAction(type) {
      const apiKey = localStorage.getItem('gemini_api_key') || document.getElementById('apiKeyInput').value.trim();
      const project = document.getElementById('projectName').value.trim() || 'Project';
      const text = document.getElementById('projectText').value.trim();
      const question = document.getElementById('customQuestion').value.trim();

      const errorDiv = document.getElementById('errorMessage');
      const outputDiv = document.getElementById('outputContent');
      const loadingDiv = document.getElementById('loadingIndicator');

      errorDiv.classList.add('hidden');

      if (!apiKey) {
        errorDiv.textContent = '⚠️ Please enter and save your Gemini API key first.';
        errorDiv.classList.remove('hidden');
        return;
      }

      if (!text) {
        errorDiv.textContent = '⚠️ Please paste notes into the Project Documents box first.';
        errorDiv.classList.remove('hidden');
        return;
      }

      let systemPrompt = "";
      if (type === 'summary') {
        systemPrompt = `Provide a structured summary of the project "${project}". Detail core objectives, key entities, and main facts grounded strictly in the provided text.`;
      } else if (type === 'gaps') {
        systemPrompt = `Analyze the notes for project "${project}". Identify critical knowledge gaps, missing operational data, unaddressed risks, or unstated metrics based strictly on the text.`;
      } else if (type === 'action_plan') {
        systemPrompt = `Create a 3-phase execution action plan for project "${project}" derived strictly from the facts provided in the text.`;
      } else if (type === 'custom') {
        if (!question) {
          errorDiv.textContent = '⚠️ Please enter a question to ask your knowledge base.';
          errorDiv.classList.remove('hidden');
          return;
        }
        systemPrompt = `Answer the question regarding project "${project}" using strictly the provided facts: ${question}`;
      }

      loadingDiv.classList.remove('hidden');
      outputDiv.textContent = '';

      try {
        // Step 1: Auto-discover available models for this specific API key
        let modelName = 'gemini-1.5-flash-8b';
        try {
          const listRes = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}`);
          const listData = await listRes.json();
          if (listData.models && listData.models.length > 0) {
            const viable = listData.models.find(m => 
              m.supportedGenerationMethods && 
              m.supportedGenerationMethods.includes('generateContent') &&
              (m.name.includes('flash') || m.name.includes('gemini'))
            );
            if (viable) {
              modelName = viable.name.replace('models/', '');
            }
          }
        } catch (e) {
          // fallback to default
        }

        // Step 2: Call generateContent with the discovered model
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{
              parts: [
                { text: systemPrompt },
                { text: `\n\n--- Knowledge Base Content ---\n${text}` }
              ]
            }]
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error?.message || 'API request failed');
        }

        const resultText = data.candidates?.[0]?.content?.parts?.[0]?.text;
        if (!resultText) {
          throw new Error('No content returned by Gemini.');
        }

        outputDiv.textContent = resultText;
      } catch (err) {
        errorDiv.textContent = `⚠️ ${err.message}`;
        errorDiv.classList.remove('hidden');
      } finally {
        loadingDiv.classList.add('hidden');
      }
    }

    function copyOutput() {
      const text = document.getElementById('outputContent').textContent;
      if (text && text !== 'Your output will appear here...') {
        navigator.clipboard.writeText(text);
        alert('Copied to clipboard!');
      }
    }
  </script>
</body>
</html>
